ai_usage_summary: |
  Used ChatGPT / Codex for architecture discussion, implementation assistance,
  code review, and documentation. The ranking code itself makes no LLM or hosted
  API calls during inference, and no candidate data is sent to external services
  by the submitted ranker.

methodology_summary: |
  Deterministic recruiter-lens ranker for the Senior AI Engineer JD. It scores
  career evidence for shipped search, retrieval, ranking, recommendation, and
  production ML systems; trust-weights skills by proficiency, duration,
  endorsements, and assessment scores; adds product-company, logistics, and
  behavioral availability signals including recruiter response quality; uses a
  calibrated confidence curve to avoid artificial perfect scores; and applies
  risk gates for keyword stuffing, services-only careers, pure CV/speech/research
  profiles, and honeypot-style impossibilities. Runs locally on CPU with no
  network or GPU.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
